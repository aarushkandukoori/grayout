name: Install or permission problem
description: Gatekeeper dialogs, Screen Recording that will not stick, the Keychain prompt, the app not starting its free checks.
title: "Install: "
labels: ["install"]
body:
  - type: markdown
    attributes:
      value: |
        The install walk-through is at https://aarushkandukoori.github.io/grayout/install.html. If you got stuck anywhere in it, that is a bug in the page or the app, and this is the right place.

        Anything about payment, a license key, a trial, or a refund goes in the **Billing or subscription problem** template instead.

        Do not attach screenshots of your own screen; a photo of a macOS dialog is fine. Never paste your license key here, not even part of it.
  - type: dropdown
    id: where
    attributes:
      label: Where did it stop?
      options:
        - Download did not start or the DMG would not open
        - The dialog said Grayout is "damaged and can't be opened"
        - The dialog said "Apple could not verify" but there was no Open Anyway button in Privacy & Security
        - Open Anyway worked but Grayout did not appear in the menu bar
        - Screen Recording stays "Not allowed" after I turned it on
        - Screen Recording says "Allowed, but stale"
        - Grayout did not come back after Relaunch Grayout
        - The Keychain prompt kept coming back or I clicked Deny
        - Onboarding finished but no check ever ran
        - The free checks did not start
        - Camera permission
        - Start at login did not work
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: The exact text of any dialog or error line, and what you clicked.
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: What does the menu bar say?
      options:
        - Watching
        - Starting
        - Setup not finished
        - Blocked (no Screen Recording access)
        - Paused
        - Free checks used up
        - Subscription needed
        - Nothing, Grayout is not in the menu bar
        - Something else (say what above)
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      description: 'Apple menu > About This Mac. "Chip: Apple M…" means Apple Silicon.'
      options:
        - Apple Silicon
        - Intel
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: dmg
    attributes:
      label: Which download
      options:
        - Grayout-arm64.dmg
        - Grayout-x64.dmg
        - Homebrew cask
        - Built from source
        - Not sure
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.0.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grayout version
      description: Menu bar > About Grayout, or the DMG you downloaded.
      placeholder: "2.0.0"
  - type: dropdown
    id: applications
    attributes:
      label: Is Grayout in /Applications?
      options:
        - "Yes"
        - "No, somewhere else"
        - Not sure
  - type: dropdown
    id: selfhosted
    attributes:
      label: Are you self-hosting?
      description: Self-hosting means provider is set to anthropic or openai in config.json and the app runs on your own key.
      options:
        - "No, I am using the subscription or the free checks"
        - "Yes, provider is anthropic"
        - "Yes, provider is openai"
        - Not sure
  - type: textarea
    id: checksum
    attributes:
      label: Checksum, if the dialog said "damaged"
      description: |
        Optional. Paste the output of this command and the matching line from SHA256SUMS.txt on the release page.

        ```bash
        shasum -a 256 ~/Downloads/Grayout-arm64.dmg
        ```
      render: text
  - type: checkboxes
    id: tried
    attributes:
      label: Already tried
      options:
        - label: Double-clicking Grayout again and going back to Privacy & Security
        - label: Turning Grayout off and on in the Screen Recording list
        - label: The tccutil reset command from Permissions > Copy the fix command
        - label: Removing quarantine with xattr
        - label: Quitting Grayout and opening it again
